name: Build Makhzani APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: unzip -q Makhzani.zip -d work

      - name: Build APK
        working-directory: work/Makhzani
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy APK
        run: cp work/Makhzani/app/build/outputs/apk/release/app-release.apk Makhzani.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Makhzani-APK
          path: Makhzani.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Makhzani APK ${{ github.run_number }}
          files: Makhzani.apk
